name: CI Verification Gate

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-hygiene:
    name: Security & Git Ignore Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Git Ignore Rules
        run: |
          # Verify .env is strictly ignored and critical code is NOT ignored
          git check-ignore frontend/src/lib/api.ts && exit 1 || true
          git check-ignore backend/app/main.py && exit 1 || true

      - name: Check for Uncommitted Secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-gate:
    name: Backend Lint & Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Ruff Format Check
        run: |
          ruff format --check backend

      - name: Ruff Lint & Import Check
        run: |
          ruff check backend

      - name: Mypy Strict Type Check
        run: |
          mypy backend/app

      - name: Cyclomatic Complexity Gate (Xenon)
        run: |
          xenon --max-absolute B --max-modules A --max-average A backend/app

      - name: Run Pytest Suite
        run: |
          pytest backend/tests -v -m "not live"

  frontend-gate:
    name: Frontend Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Prettier Formatting Check
        working-directory: frontend
        run: npm run format:check

      - name: ESLint Check
        working-directory: frontend
        run: npm run lint

      - name: TypeScript Validation
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Vitest Unit Suite
        working-directory: frontend
        run: npx vitest run

      - name: Production Build
        working-directory: frontend
        run: npm run build
        env:
          ALLOW_LOCAL_BACKEND: "true"

  e2e-gate:
    name: Playwright End-to-End & Accessibility
    needs: frontend-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium with System Dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Test Suite
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
