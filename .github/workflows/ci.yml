name: CI Verification Gate

on:
  push:
    branches: [ main, "fix/**", "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-hygiene:
    name: Security & Git Ignore Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Git Ignore Rules
        run: |
          # Verify .env is strictly ignored and critical code is NOT ignored
          git check-ignore frontend/src/lib/api.ts && exit 1 || true
          git check-ignore backend/app/main.py && exit 1 || true

      - name: Check for Uncommitted Secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  backend-gate:
    name: Backend Lint & Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Ruff Lint & Import Check
        run: |
          ruff check backend

      - name: Run Pytest Suite
        run: |
          pytest backend/tests -v -m "not live"

  frontend-gate:
    name: Frontend Typecheck, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Validation
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Production Build
        working-directory: frontend
        run: npm run build
        env:
          ALLOW_LOCAL_BACKEND: "true"
